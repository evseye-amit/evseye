name: Deploy — Production

# Promote the exact immutable images that completed the staging deployment.
# This workflow is intentionally manual: production is never rebuilt from source.
on:
  workflow_dispatch:
    inputs:
      staging_sha:
        description: "40-character source commit SHA recorded by staging provenance"
        required: true
        type: string
      staging_run_id:
        description: "Successful deploy-staging workflow run ID containing the provenance artifact"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: ap-south-2
  STAGING_AWS_REGION: ap-south-1
  # Target ECR/ECS settings come from the production GitHub environment.
  # STAGING_AWS_ACCOUNT_ID and optional repository variables identify the
  # source ECR account; no source credentials or secrets enter the artifact.

jobs:
  # ─── Verify staging provenance and source/target tree equivalence ───────────
  verify-staging:
    name: Verify successful staging candidate
    runs-on: ubuntu-latest
    outputs:
      staging_sha: ${{ steps.provenance.outputs.staging_sha }}
      api_digest: ${{ steps.provenance.outputs.api_digest }}
      web_digest: ${{ steps.provenance.outputs.web_digest }}
    steps:
      - name: Verify main ref and matching source tree
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ inputs.staging_sha }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PRODUCTION_DEPLOY_ENABLED" = "true"
          [[ "$STAGING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$target_sha" = "$GITHUB_SHA"
          staging_tree="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$STAGING_SHA" --jq .commit.tree.sha)"
          target_tree="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$target_sha" --jq .commit.tree.sha)"
          test "$staging_tree" = "$target_tree"
          echo "Promoting source commit $STAGING_SHA; tree matches main $target_sha."

      - name: Verify successful staging deployment run
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ inputs.staging_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$STAGING_RUN_ID")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$STAGING_SHA" '
            .path == ".github/workflows/deploy-staging.yml" and
            .head_repository.full_name == $repo and
            .conclusion == "success" and
            .event == "workflow_run"
          ' <<< "$run_json" >/dev/null
          run_attempt="$(jq -er '.run_attempt' <<< "$run_json")"
          artifact="staging-deployment-provenance-${run_attempt}"
          rm -rf staging-provenance
          gh run download "$STAGING_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir staging-provenance
          provenance_file="$(find staging-provenance -type f -name staging-deployment-provenance.json -print -quit)"
          test -n "$provenance_file"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$STAGING_SHA" --arg run "$STAGING_RUN_ID" --arg attempt "$run_attempt" '
            .workflow == "deploy-staging.yml" and
            .stagingWorkflowRunId == $run and
            .stagingWorkflowRunAttempt == $attempt and
            .sourceSha == $sha and
            .sourceBranch == "dev" and
            .sourceRepository == $repo and
            .imageTag == $sha and
            (.apiDigest | test("^sha256:[0-9a-f]{64}$")) and
            (.webDigest | test("^sha256:[0-9a-f]{64}$"))
          ' "$provenance_file" >/dev/null
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"
          echo "api_digest=$(jq -er '.apiDigest' "$provenance_file")" >> "$GITHUB_OUTPUT"
          echo "web_digest=$(jq -er '.webDigest' "$provenance_file")" >> "$GITHUB_OUTPUT"

  # ─── Copy immutable staging images to production ECR ───────────────────────
  promote-images:
    name: Promote staging images by digest
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: production
    needs: verify-staging
    outputs:
      api_digest: ${{ steps.promote.outputs.api_digest }}
      web_digest: ${{ steps.promote.outputs.web_digest }}
    env:
      STAGING_SHA: ${{ needs.verify-staging.outputs.staging_sha }}
      EXPECTED_API_DIGEST: ${{ needs.verify-staging.outputs.api_digest }}
      EXPECTED_WEB_DIGEST: ${{ needs.verify-staging.outputs.web_digest }}
      STAGING_AWS_ACCOUNT_ID: ${{ vars.STAGING_AWS_ACCOUNT_ID }}
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
    steps:
      - name: Recheck main and production switch after approval
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ needs.verify-staging.outputs.staging_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$target_sha" = "$GITHUB_SHA"
          test "$PRODUCTION_DEPLOY_ENABLED" = "true"
          echo "main and the production switch still match the approved candidate $STAGING_SHA."

      - name: Install Skopeo
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi
          skopeo --version

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote source digests to production ECR
        id: promote
        env:
          TARGET_API_REPO: ${{ secrets.ECR_API_REPO }}
          TARGET_WEB_REPO: ${{ secrets.ECR_WEB_REPO }}
        run: |
          set -euo pipefail
          test -n "$STAGING_AWS_ACCOUNT_ID"
          test -n "$TARGET_API_REPO"
          test -n "$TARGET_WEB_REPO"
          source_registry="${STAGING_AWS_ACCOUNT_ID}.dkr.ecr.${STAGING_AWS_REGION}.amazonaws.com"
          target_account="$(aws sts get-caller-identity --query Account --output text)"
          target_registry="${target_account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$STAGING_AWS_REGION" | docker login --username AWS --password-stdin "$source_registry"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$target_registry"
          promotion_tag="promoted-${STAGING_SHA}"

          source_api_image="$source_registry/evseye-staging-api@$EXPECTED_API_DIGEST"
          source_web_image="$source_registry/evseye-staging-web@$EXPECTED_WEB_DIGEST"
          target_api_image="$target_registry/$TARGET_API_REPO:$promotion_tag"
          target_web_image="$target_registry/$TARGET_WEB_REPO:$promotion_tag"
          # Registry-to-registry copy preserves OCI indexes, layers, and
          # attestations; docker pull/tag/push would reduce an index to the
          # runner platform. Skopeo does not place image bytes on disk.
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "docker://$source_api_image" "docker://$target_api_image"
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "docker://$source_web_image" "docker://$target_web_image"

          promoted_api_digest="$(aws ecr batch-get-image --region "$AWS_REGION" --repository-name "$TARGET_API_REPO" --image-ids imageTag="$promotion_tag" --query 'images[0].imageId.imageDigest' --output text)"
          promoted_web_digest="$(aws ecr batch-get-image --region "$AWS_REGION" --repository-name "$TARGET_WEB_REPO" --image-ids imageTag="$promotion_tag" --query 'images[0].imageId.imageDigest' --output text)"
          test "$promoted_api_digest" = "$EXPECTED_API_DIGEST"
          test "$promoted_web_digest" = "$EXPECTED_WEB_DIGEST"
          {
            echo "api_digest=$promoted_api_digest"
            echo "web_digest=$promoted_web_digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ✅ Images promoted by digest" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Staging commit**: \`$STAGING_SHA\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **API digest**: \`$promoted_api_digest\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Web digest**: \`$promoted_web_digest\`" >> "$GITHUB_STEP_SUMMARY"
          }

  # ─── Run Prisma migration (one-shot ECS task) ──────────────────────────────
  migrate:
    name: Run DB migration
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: production
    needs: promote-images

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve public ECS subnets
        id: network
        run: |
          subnets="$(aws ec2 describe-subnets \
            --filters \
              "Name=tag:Project,Values=evseye" \
              "Name=tag:Environment,Values=production" \
              "Name=tag:Name,Values=evseye-production-public-*" \
            --query 'sort_by(Subnets, &AvailabilityZone)[].SubnetId' \
            --output text | tr '\t' ',')"
          test -n "$subnets"
          IFS=',' read -r -a subnet_list <<< "$subnets"
          test "${#subnet_list[@]}" -ge 2
          echo "subnets=$subnets" >> "$GITHUB_OUTPUT"

      - name: Download current migration task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_MIGRATE_TASK }}" \
            --query taskDefinition \
            > migrate-task-def.json

      - name: Update migration image in task definition
        id: migrate-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: migrate-task-def.json
          container-name: migrate
          image: ${{ secrets.ECR_API_URL }}@${{ needs.promote-images.outputs.api_digest }}

      - name: Run Prisma migrate deploy
        id: migrate-task-run
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.migrate-task-def.outputs.task-definition }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          run-task: true
          run-task-launch-type: FARGATE
          run-task-container-overrides: >-
            [{"name":"migrate","command":["sh","-c","exec node apps/api/scripts/deploy-migrations.mjs"]}]
          run-task-subnets: ${{ steps.network.outputs.subnets }}
          run-task-security-groups: ${{ secrets.ECS_TASK_SG }}
          run-task-assign-public-IP: ENABLED
          wait-for-task-stopped: true

      - name: Diagnose failed migration task
        if: failure() && steps.migrate-task-run.outcome == 'failure'
        continue-on-error: true
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER }}
          TASK_ARNS_JSON: ${{ steps.migrate-task-run.outputs.run-task-arn }}
          TASK_DEFINITION_FILE: ${{ steps.migrate-task-def.outputs.task-definition }}
        run: |
          task_arns_json="$(jq -n --arg raw "${TASK_ARNS_JSON:-}" 'if $raw == "" then [] else (try ($raw | fromjson) catch [$raw]) | if type == "array" then . else [.] end end')"
          mapfile -t task_arns < <(jq -r '.[]' <<< "$task_arns_json")

          if [ "${#task_arns[@]}" -eq 0 ]; then
            echo "::warning::The ECS action did not return a migration task ARN. Check the RunTask failure details above."
            exit 0
          fi

          task_details="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "${task_arns[@]}" \
            --output json)"

          echo "Migration task stopped details:"
          jq '{failures, tasks: [.tasks[] | {
            taskArn,
            lastStatus,
            desiredStatus,
            stopCode,
            stoppedReason,
            containers: [.containers[] | {
              name,
              lastStatus,
              exitCode,
              reason,
              image,
              logStreamName
            }]
          }]}' <<< "$task_details"

          log_options="$(jq -c '.containerDefinitions[] | select(.name == "migrate") | .logConfiguration.options // {}' "$TASK_DEFINITION_FILE")"
          log_group="$(jq -r '."awslogs-group" // empty' <<< "$log_options")"
          log_prefix="$(jq -r '."awslogs-stream-prefix" // empty' <<< "$log_options")"
          log_stream="$(jq -r '[.tasks[].containers[] | select(.name == "migrate") | .logStreamName][0] // empty' <<< "$task_details")"

          if [ -z "$log_stream" ] && [ -n "$log_prefix" ]; then
            task_id="$(jq -r '[.tasks[].taskArn][0] // empty' <<< "$task_details" | awk -F/ '{print $NF}')"
            if [ -n "$task_id" ]; then
              log_stream="$log_prefix/migrate/$task_id"
            fi
          fi

          if [ -n "$log_group" ] && [ -n "$log_stream" ]; then
            echo "CloudWatch log stream: $log_group/$log_stream"
            if ! aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$log_stream" \
              --start-from-head \
              --limit 100 \
              --query 'events[].message' \
              --output text; then
              echo "::warning::Could not read the migration task log stream. Check CloudWatch permissions or open the stream above."
            fi
          else
            echo "::warning::Migration task log configuration is incomplete (group='$log_group', stream-prefix='$log_prefix'). Inspect the task in the ECS console."
          fi

  # ─── Update ECS services ───────────────────────────────────────────────────
  deploy:
    name: Update ECS services
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: production
    needs: [promote-images, migrate]

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── API ──
      - name: Download current API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_API_TASK }}" \
            --query taskDefinition \
            > api-task-def.json

      - name: Update API image in task definition
        id: api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-def.json
          container-name: api
          image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_API_REPO }}@${{ needs.promote-images.outputs.api_digest }}

      - name: Deploy API to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_API_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ── Web ──
      - name: Download current Web task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_WEB_TASK }}" \
            --query taskDefinition \
            > web-task-def.json

      - name: Update Web image in task definition
        id: web-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: web-task-def.json
          container-name: web
          image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_WEB_REPO }}@${{ needs.promote-images.outputs.web_digest }}

      - name: Deploy Web to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_WEB_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify running services use promoted digests
        env:
          API_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_API_REPO }}@${{ needs.promote-images.outputs.api_digest }}
          WEB_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_WEB_REPO }}@${{ needs.promote-images.outputs.web_digest }}
        run: |
          set -euo pipefail
          api_running="$(aws ecs describe-services --cluster "${{ secrets.ECS_CLUSTER }}" --services "${{ secrets.ECS_API_SERVICE }}" --query 'services[0].runningCount' --output text)"
          web_running="$(aws ecs describe-services --cluster "${{ secrets.ECS_CLUSTER }}" --services "${{ secrets.ECS_WEB_SERVICE }}" --query 'services[0].runningCount' --output text)"
          test "$api_running" -ge 1
          test "$web_running" -ge 1
          api_task_definition="$(aws ecs describe-services --cluster "${{ secrets.ECS_CLUSTER }}" --services "${{ secrets.ECS_API_SERVICE }}" --query 'services[0].taskDefinition' --output text)"
          web_task_definition="$(aws ecs describe-services --cluster "${{ secrets.ECS_CLUSTER }}" --services "${{ secrets.ECS_WEB_SERVICE }}" --query 'services[0].taskDefinition' --output text)"
          api_image="$(aws ecs describe-task-definition --task-definition "$api_task_definition" --query 'taskDefinition.containerDefinitions[?name==`api`].image | [0]' --output text)"
          web_image="$(aws ecs describe-task-definition --task-definition "$web_task_definition" --query 'taskDefinition.containerDefinitions[?name==`web`].image | [0]' --output text)"
          test "$api_image" = "$API_IMAGE"
          test "$web_image" = "$WEB_IMAGE"

      - name: Deployment summary
        run: |
          echo "### ✅ Production deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Staging commit**: \`${{ inputs.staging_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API digest**: \`${{ needs.promote-images.outputs.api_digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Web digest**: \`${{ needs.promote-images.outputs.web_digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Web**: https://${{ secrets.WEB_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API health**: https://${{ secrets.API_URL }}/health" >> "$GITHUB_STEP_SUMMARY"
