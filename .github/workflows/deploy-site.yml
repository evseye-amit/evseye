name: Deploy marketing site

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: marketing-site-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  validate:
    if: >
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify this is the current branch commit
        env:
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq .object.sha)"
          test -n "$current_sha"
          if [ "$current_sha" != "$PASSED_SHA" ]; then
            echo "::error::CI passed for $PASSED_SHA, but $BRANCH now points to $current_sha"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: hashicorp/setup-terraform@v3
      - name: Validate marketing infrastructure
        working-directory: infra/site
        run: |
          terraform init -backend=false
          terraform validate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate static site
        env:
          SITE_ENVIRONMENT: production
        run: node apps/site/scripts/build.mjs

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate static site
        env:
          SITE_ENVIRONMENT: production
        run: node apps/site/scripts/build.mjs
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SITE_AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Publish files
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          set -euo pipefail
          : "${SITE_BUCKET:?Set SITE_BUCKET from the Terraform output}"
          aws s3 sync apps/site/dist/ "s3://${SITE_BUCKET}/" \
            --delete --cache-control 'public,max-age=300'
          for page in index.html 404.html; do
            aws s3 cp "apps/site/dist/${page}" "s3://${SITE_BUCKET}/${page}" \
              --content-type 'text/html; charset=utf-8' --cache-control 'no-cache'
          done
      - name: Invalidate CloudFront
        env:
          SITE_DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          : "${SITE_DISTRIBUTION_ID:?Set SITE_DISTRIBUTION_ID from the Terraform output}"
          aws cloudfront create-invalidation \
            --distribution-id "$SITE_DISTRIBUTION_ID" --paths '/*'
