events { worker_connections 1024; }
http {
  # This edge is directly internet-facing. Do not trust arbitrary forwarded IPs.
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
  limit_req_status 429;
  server_tokens off;
  upstream app { server web:3001; }
  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    # Preserve the viewer's hostname AND port for exact-origin checks.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 35s;
    proxy_cache off;
    location ^~ /api/v1/auth/ { limit_req zone=login burst=10 nodelay; proxy_pass http://app; }
    location ^~ /api/v1/ { limit_req zone=api burst=30 nodelay; proxy_pass http://app; }
    location / { proxy_pass http://app; }
  }
  # Local-only private storage endpoint, preserving signed Host and request path.
  server {
    listen 444 ssl;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://minio:9000;
    }
  }
}
