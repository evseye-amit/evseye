services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evseye
      POSTGRES_PASSWORD: evseye
      POSTGRES_DB: evseye
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evseye -d evseye"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evseye-minio
      MINIO_ROOT_PASSWORD: evseye-minio-local-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    environment:
      MINIO_ROOT_USER: evseye-minio
      MINIO_ROOT_PASSWORD: evseye-minio-local-password
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/evs-eye-local
        mc anonymous set none local/evs-eye-local
        mc anonymous set download local/evs-eye-local/platform/oems

  api:
    image: evseye-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://evseye:evseye@postgres:5432/evseye?schema=public
      REDIS_URL: redis://redis:6379
      S3_BUCKET: evs-eye-local
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      MEDIA_PUBLIC_BASE_URL: http://localhost:9000/evs-eye-local
      AWS_ACCESS_KEY_ID: evseye-minio
      AWS_SECRET_ACCESS_KEY: evseye-minio-local-password
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  migrate:
    image: evseye-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://evseye:evseye@postgres:5432/evseye?schema=public
    command:
      [
        "./apps/api/node_modules/.bin/prisma",
        "migrate",
        "deploy",
        "--schema=apps/api/prisma/schema.prisma",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: evseye-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://evseye:evseye@postgres:5432/evseye?schema=public
      S3_BUCKET: evs-eye-local
      S3_ENDPOINT: http://minio:9000
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: evseye-minio
      AWS_SECRET_ACCESS_KEY: evseye-minio-local-password
    command: ["node", "apps/api/prisma/seed.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  web:
    image: evseye-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
