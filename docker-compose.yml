services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evseye
      POSTGRES_PASSWORD: evseye
      POSTGRES_DB: evseye
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evseye -d evseye"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: evseye-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: development
      OBJECT_STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: /var/lib/evseye/uploads
      DATABASE_URL: postgresql://evseye:evseye@postgres:5432/evseye?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - ./.local-storage:/var/lib/evseye/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  migrate:
    image: evseye-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://evseye:evseye@postgres:5432/evseye?schema=public
    command:
      [
        "./apps/api/node_modules/.bin/prisma",
        "migrate",
        "deploy",
        "--schema=apps/api/prisma/schema.prisma",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: evseye-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://evseye:evseye@postgres:5432/evseye?schema=public
    command: ["node", "apps/api/prisma/seed.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: evseye-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  postgres_data:
