# Optional local HTTPS edge. Use together with docker-compose.yml.
services:
  api:
    environment:
      S3_PUBLIC_ENDPOINT: https://localhost:9443
      MEDIA_PUBLIC_BASE_URL: https://localhost:9443/evs-eye-local
  web:
    environment:
      SESSION_COOKIE_SECURE: "true"
  client-edge:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:9443:444"
    volumes:
      - ./deployment/client-access/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/client-access/local-tls:/etc/nginx/tls:ro
    depends_on:
      - web
